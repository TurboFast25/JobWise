[project]
name = "jobwise"
version = "0.4.0"
description = "Social recipe rating and discovery platform"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.15.2",
    "email-validator>=2.2.0",
    "fastapi>=0.115.11",
    "bcrypt>=4.0.0",
    "psycopg[binary]>=3.2.6",
    "pydantic>=2.10.6",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.39",
    "uvicorn[standard]>=0.34.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "ruff>=0.11.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
